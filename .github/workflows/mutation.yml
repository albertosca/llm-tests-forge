name: mutation
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"
  pull_request:
    paths:
      - "src/core/**"
      - "tests/core/**"
      - "stryker.config.mjs"
permissions:
  contents: read
jobs:
  mutation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      # The Stryker CLI is a Node script.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bun install --frozen-lockfile
      - run: bun run mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
