name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun test --coverage --coverage-reporter=lcov --coverage-reporter=text
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info
      # The coverage badge reads a JSON file on the `badges` branch through
      # shields.io's endpoint badge, so no third-party account is involved.
      # The figure is the line coverage lcov reports, which is what the
      # 1.0 gate in bunfig.toml enforces per file.
      - name: Compute line coverage from lcov
        id: coverage
        run: |
          pct=$(awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END{printf "%.1f", 100*lh/lf}' coverage/lcov.info)
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          echo "line coverage: $pct%"
      - name: Publish the coverage badge data to the badges branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          PCT: ${{ steps.coverage.outputs.pct }}
        run: |
          # The single quotes keep the JavaScript's own ${...} away from the shell.
          # shellcheck disable=SC2016
          bun -e 'const p = Number(process.env.PCT); const color = p >= 95 ? "brightgreen" : p >= 80 ? "yellow" : "red"; require("node:fs").writeFileSync("/tmp/coverage.json", `${JSON.stringify({ schemaVersion: 1, label: "coverage", message: `${p}%`, color })}\n`)'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin badges >/dev/null; then
            git fetch origin badges
            git checkout -B badges origin/badges
          else
            git checkout --orphan badges
            git rm -rf --quiet .
          fi
          cp /tmp/coverage.json coverage.json
          git add coverage.json
          git commit -m "Update the coverage badge: ${PCT}%" || echo "coverage unchanged"
          git push origin badges
  # The opt-in package tests: each package built from a freshly compiled
  # binary and installed into a temporary prefix with its own tool. The
  # Homebrew test skips here (no brew on the PATH of a Linux runner).
  packages:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # setup-uv publishes no major tags since v8, only immutable releases.
      # Its cache stays off: the package tests point uv at
      # node_modules/.cache/forge-uv, so restoring setup-uv's cache (about 3 s
      # on 2026-10-01) bought nothing; the cold download it would save is
      # hatchling and five small wheels, 1.9 MB and about 0.5 s.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"
      - run: mix local.hex --force
      - run: bun run test:packages
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
  promptfoo-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run validate:example
