# Used only by `bun run test:shims` (via --config), never by plain `bun
# test`. `bun test tests/shims` exercises a sliver of `src/`, so the
# coverage floor in `bunfig.toml` would fail a passing run (measured:
# 1 pass, exit 1). Coverage is enforced by the full suite (`bun test` /
# `bun run check`), which this file never touches.
[test]
coverage = false
