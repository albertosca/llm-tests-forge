          let obj; try { obj = JSON.parse(text.slice(start, end + 1)); } catch (e) { return `output is not JSON: ${e.message}`; }
          const want = {"questions":[{"label":"First Name","kind":"text","required":false,"options":[]},{"label":"Last Name","kind":"text","required":false,"options":[]},{"label":"Email","kind":"text","required":false,"options":[]},{"label":"Phone Number","kind":"text","required":false,"options":[]},{"label":"Are you legally authorized to work in the United States?","kind":"single_select","required":false,"options":["Yes","No"]},{"label":"Will you now or in the future require sponsorship for employment visa status?","kind":"single_select","required":false,"options":["Yes","No"]},{"label":"Resume/CV","kind":"file","required":false,"options":[]},{"label":"How did you hear about this position?","kind":"text","required":false,"options":[]}]};
          const differences = [];
          const show = (value) => JSON.stringify(value);
          const hasStringLabel = (item) => item !== null && typeof item === 'object' && typeof item.label === 'string';
          const hasDuplicateLabels = (items) => {
            const seenLabels = new Set();
            for (const item of items) {
              if (!hasStringLabel(item)) continue;
              if (seenLabels.has(item.label)) return true;
              seenLabels.add(item.label);
