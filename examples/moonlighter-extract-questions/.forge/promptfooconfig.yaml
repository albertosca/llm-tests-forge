        Horizon Robotics Careers
        Home | About Us | Open Positions | Contact

        Software Engineer, Backend
        San Francisco, CA · Full-time · Engineering

        At Horizon Robotics we build autonomous delivery systems that are reshaping urban logistics. Our backend team owns the services that coordinate thousands of robots in real time. You will work closely with hardware, ML, and product teams to ship reliable, low-latency systems.

        What you'll do:
        - Design and maintain distributed services in Go and Python
        - Own on-call rotations for critical infrastructure
        - Collaborate with the robotics fleet team on real-time telemetry

        What we're looking for:
        - 3+ years of backend experience
