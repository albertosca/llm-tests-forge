      Join Our Team at Meridian Analytics

      Meridian Analytics is a fast-growing data intelligence firm headquartered in Austin, Texas, with satellite offices in Denver and Toronto. Founded in 2014, we have grown from a three-person startup to a company of over 400 employees serving Fortune 500 clients across finance, healthcare, and retail sectors.

      Why Work With Us?

      At Meridian, we believe in fostering a culture of innovation, collaboration, and continuous learning. Our benefits package includes comprehensive health insurance, unlimited PTO, a generous 401(k) match, and an annual professional development stipend of $3,000 per employee. We host quarterly hackathons, monthly team outings, and an annual company retreat in various locations around the world.

      Our Values

      Integrity: We do what we say we will do.
      Curiosity: We never stop asking questions and seeking better solutions.
      Collaboration: We believe the best ideas come from diverse teams working together.
      Excellence: We hold ourselves to the highest standards in everything we build.

