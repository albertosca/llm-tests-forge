  - description: standard-interview-request-email-01
    metadata:
      scenario: standard-interview-request-email
      case: standard-interview-request-email-01
      kind: happy
      oracle: label
    vars:
      email: |-
        From: Priya Nair <priya.nair@brightwave.io>
        Subject: Interview Invitation - Senior Backend Engineer
        Body: Hi Marcus,

        Thank you for your patience throughout our process. We'd love to move forward with a video interview for the Senior Backend Engineer position at Brightwave. Would you be available this Thursday, March 14th at 2:00 PM PST for a 45-minute call with our engineering lead, Tom Reyes? We'll send a Zoom link once you confirm.

        Looking forward to speaking with you.

        Best,
        Priya Nair
        Talent Acquisition, Brightwave
    assert:
      - type: javascript
        value: |-
          const text = String(output).replace(/^\s*```(?:json)?\s*/i, "").replace(/\s*```\s*$/, "");
          const start = text.indexOf("{"); const end = text.lastIndexOf("}");
          if (start < 0 || end < start) return `no JSON object in output: ${text.slice(0, 80)}`;
          let obj; try { obj = JSON.parse(text.slice(start, end + 1)); } catch (e) { return `output is not JSON: ${e.message}`; }
          return obj["type"] === "interview" ? true : "type" + " was " + JSON.stringify(obj["type"]) + ", expected " + "interview";
