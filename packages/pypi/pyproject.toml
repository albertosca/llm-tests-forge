[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-tests-forge"
version = "0.1.0"
description = "Forge reviewed regression suites for your LLM features and emit them for promptfoo"
license = "MIT"
requires-python = ">=3.9"

[project.urls]
Repository = "https://github.com/albertosca/llm-tests-forge"

[project.scripts]
llm-tests-forge = "llm_tests_forge:main"

# Wheel only: the platform binary is injected by hatch_build.py, so there is no sdist to build.
[tool.hatch.build.targets.wheel]
packages = ["src/llm_tests_forge"]

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
